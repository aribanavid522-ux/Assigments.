<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chess_box</title>
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .chess{
            width: 650px;
            height: 650px;
            display:grid;
            grid-template-columns: repeat(8,1fr);
            grid-template-rows: repeat(8,1fr);
            border: 1px solid black;
        }
        .box{
            border: 2px solid black;
            gap: 1px;
        }
        .box.a{
            background-color:white;
            font-size: 55px;
            align-items: center; 
        }
        .box.b{
            background-color: black;
            font-size: 55px;
            color: aliceblue;
            align-items: center;
        }
    </style>
</head>
<body>
    <!-- a=white , b=black -->
    <div class="chess">
    <div class="box a"> &#9812;</div>
    <div class="box b"> &#9813;</div>
    <div class="box a">&#9814;</div>
    <div class="box b">&#9815;</div>
    <div class="box a">&#9816;</div>
    <div class="box b">&#9817;</div>
    <div class="box a">&#9818;</div>
    <div class="box b">&#9812;</div>

    <div class="box b">&#9823;</div>
    <div class="box a">&#9823;</div>
    <div class="box b">&#9823;</div>
    <div class="box a">&#9823;</div>
    <div class="box b">&#9823;</div>
    <div class="box a">&#9823;</div>
    <div class="box b">&#9823;</div>
    <div class="box a">&#9823;</div>

    <div class="box a"></div>
    <div class="box b"></div>
    <div class="box a"></div>
    <div class="box b"></div>
    <div class="box a"></div>
    <div class="box b"></div>
    <div class="box a"></div>
    <div class="box b"></div>

    <div class="box b"></div>
    <div class="box a"></div>
    <div class="box b"></div>
    <div class="box a"></div>
    <div class="box b"></div>
    <div class="box a"></div>
    <div class="box b"></div>
    <div class="box a"></div>

    <div class="box a"></div>
    <div class="box b"></div>
    <div class="box a"></div>
    <div class="box b"></div>
    <div class="box a"></div>

</html>
